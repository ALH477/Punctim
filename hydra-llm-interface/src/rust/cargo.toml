[package]
name = "streamdb"
version = "0.1.0"
edition = "2025"
authors = ["DeMoD LLC"]
description = "StreamDb - embedded path-keyed binary stream store (LLM interface build)"
# LGPL-3.0-or-later, matching every licence header in hydra-llm-interface/.
# (The repo's other StreamDb, HandHelds/core, is LGPL-3.0-only.)
license = "LGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
uuid = { version = "1.0", features = ["v4"] }
crc = "3.0"
memmap2 = "0.5"
byteorder = "1.4"
parking_lot = "0.12"
lru = "0.8"
