[package]
name = "dcf-spa-authorizer"
version = "0.1.0"
edition = "2021"
authors = ["DeMoD LLC <alh477@demod.ltd>"]
description = "DCF-SPA: single-packet port authorization for Punctim (authentication-only, EAR99)"
license = "LGPL-3.0-only"

[[bin]]
name = "dcf-spa-authorizer"
path = "src/main.rs"

[lib]
name = "dcf_spa"
path = "src/lib.rs"

[dependencies]
ed25519-dalek = "2"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"
