# SPDX-License-Identifier: LGPL-3.0-only
# Packaging for the DeMoD Communications Framework (DCF / Punctim) Python SDK.
# Build a wheel:   cd python && python3 -m build
# Install locally: pip install ./python            (add [grpc] for the gRPC client)
# Publish:         see RELEASING.md (needs a PyPI token; not run by CI).
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "demod-dcf"
version = "0.3.0"
description = "DeMoD Communications Framework (DCF / Punctim) — the certified 17-byte wire quantum, a stdlib UDP self-healing mesh node, and a Reed-Solomon-FEC SDR modem (mesh over UDP *or* radio)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-3.0-only" }
authors = [{ name = "DeMoD LLC", email = "demodllc@gmail.com" }]
keywords = ["mesh", "networking", "udp", "p2p", "sdr", "radio", "reed-solomon", "fec", "protocol", "ham-radio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
  "Topic :: System :: Networking",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
# The gRPC client/master (dcf.client / dcf.master) and config tooling.
grpc = ["grpcio", "grpcio-tools", "protobuf", "click", "jsonschema", "networkx"]

[project.urls]
Homepage = "https://github.com/ALH477/Punctim"
Documentation = "https://github.com/ALH477/Punctim/tree/main/Documentation"
Repository = "https://github.com/ALH477/Punctim"

[project.scripts]
# Mesh over radio: frame -> RS-FEC -> IQ -> SoapySDR / .cf32 -> frame.
dcf-sdr = "dcf.modem.sdr:main"
# Stdlib UDP self-healing mesh node (interoperates with the Go/C/Rust nodes).
dcf-node = "dcf_node:main"
# Bridge DeModFrames across transports (UDP / audio / SDR / file) for any network shape.
dcf-bridge = "dcf.bridge:main"
# ETSI GS QKD 014 key-delivery bridge: end-to-end harness over a loopback transport.
dcf-qkd-demo = "dcf.qkd.demo:main"
# The DCF medium tool: frames between any two media, deterministically (DCF_MEDIUM_SPEC.md).
punctim = "punctim:main"

[tool.setuptools]
# dcf_node.py and punctim.py are top-level script modules; the SDR modem + reference codecs ship
# *under* the dcf package (dcf.modem, dcf.MCP) so their sibling-relative sys.path
# resolution works identically from-source and once installed.
py-modules = ["dcf_node", "punctim"]
packages = [
  "dcf", "dcf.modem", "dcf.MCP",
  # Subpackages: each is importable from-source, so each must also ship in the wheel.
  "dcf.pipe", "dcf.qkd", "dcf.sense", "dcf.spa",
]

[tool.setuptools.package-dir]
"dcf" = "dcf"
"dcf.modem" = "modem"
"dcf.MCP" = "MCP"

[tool.setuptools.package-data]
# `punctim certify` falls back to the packaged medium certificate when Documentation/ is absent.
"dcf.MCP" = ["medium_vectors.json"]
